<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title" class="login-card__title">Hi</h1>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-form-field label="Email" fieldId="email" [control]="form.controls.email" required>
        <svg fieldIcon class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" aria-hidden="true" focusable="false">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="m3 7 9 6 9-6" />
        </svg>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
      </app-form-field>

      <app-form-field label="Password" fieldId="password" [control]="form.controls.password" required>
        <svg fieldIcon class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" aria-hidden="true" focusable="false">
          <circle cx="7.5" cy="12" r="3.5" />
          <path d="M11 12h10M17 12v3M20 12v2" />
        </svg>
        <input
          id="password"
          formControlName="password"
          autocomplete="current-password"
          [type]="showPassword() ? 'text' : 'password'"
        />
        <button
          fieldSuffix
          type="button"
          class="icon-button"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
          (click)="togglePasswordVisibility()"
        >
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.6" aria-hidden="true" focusable="false">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
            @if (!showPassword()) {
              <path d="M4 4l16 16" />
            }
          </svg>
        </button>
      </app-form-field>

      @if (errorMessage(); as message) {
        <app-alert [message]="message" />
      }

      <button type="submit" class="login-button" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <app-spinner size="small" label="Logging in" />
          <span>LOGGING IN...</span>
        } @else {
          LOGIN
        }
      </button>
    </form>
  </section>
</main>
