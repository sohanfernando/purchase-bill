<h2 class="summary__title">
  <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    aria-hidden="true" focusable="false">
    <rect x="5" y="3" width="14" height="18" rx="2" />
    <path d="M9 8h6M9 12h6M9 16h4" />
  </svg>
  Summary
</h2>

<section aria-labelledby="item-summary-heading">
  <h3 id="item-summary-heading" class="summary__group-title">
    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      aria-hidden="true" focusable="false">
      <path d="M21 8 12 3 3 8v8l9 5 9-5V8Z" />
      <path d="m3 8 9 5 9-5M12 13v8" />
    </svg>
    Item Summary
  </h3>

  <dl class="summary__list" aria-live="polite">
    <div class="summary__row">
      <dt>Total Items</dt>
      <dd>{{ totalItems() | number }}</dd>
    </div>
    <div class="summary__row">
      <dt>Total Qty</dt>
      <dd>{{ totalQuantity() | number }}</dd>
    </div>
  </dl>
</section>
