<label class="form-field__label" [for]="fieldId()">
  <ng-content select="[fieldIcon]" />
  <span>{{ label() }}</span>
  @if (required()) {
    <span class="form-field__required" aria-hidden="true">*</span>
  }
</label>

<div class="form-field__control" [class.form-field__control--invalid]="errorMessage() !== null">
  <ng-content />
  <ng-content select="[fieldSuffix]" />
</div>

@if (errorMessage(); as message) {
  <p class="form-field__error" role="alert">{{ message }}</p>
}
