server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Build files have content hashes in their names, so browsers can cache them for a long time.
    location ~* \.(?:js|css|ico|png|svg|jpg|jpeg|gif|webp|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Angular routes such as /purchase-bill are handled by index.html; never cache it so new deploys show up.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
